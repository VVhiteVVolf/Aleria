[build]
  command = "node Karten/tools/build-media-library.mjs"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # Safelist only the public Firebase browser identifier; all other smart detection remains active.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyCgSej0WkSlkfAlySKZAdCyu4JjTNZEnYg"

[[redirects]]
  from = "/karten-v2/assets/*"
  to = "/karten-v2/dist/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/karten-v2/maps/*"
  to = "/karten-v2/dist/maps/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/karten-v2/*"
  to = "/karten-v2/dist/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/firebase/*"
  to = "/not_found.html"
  status = 404
  force = true

[[redirects]]
  from = "/firebase.json"
  to = "/not_found.html"
  status = 404
  force = true

[[redirects]]
  from = "/Stammb%C3%A4ume/tests/*"
  to = "/not_found.html"
  status = 404
  force = true

[[redirects]]
  from = "/AleriaAlmanach/scripts/*"
  to = "/not_found.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
