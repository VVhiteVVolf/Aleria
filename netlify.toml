[build]
  command = "node Karten/tools/build-media-library.mjs"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # Safelist only the public Firebase browser identifier; all other smart detection remains active.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyCgSej0WkSlkfAlySKZAdCyu4JjTNZEnYg"

[[redirects]]
  from = "/Karten/Cenyr/celtigerns-wacht/CeltigernsWachtKarte.html"
  to = "/Karten/karte.html?map=cenyr-celtigerns-wacht"
  status = 301
  force = true

[[redirects]]
  from = "/karten-v2/assets/*"
  to = "/karten-v2/dist/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/karten-v2/maps/*"
  to = "/karten-v2/dist/maps/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/karten-v2/*"
  to = "/karten-v2/dist/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/firebase/*"
  to = "/not_found.html"
  status = 404
  force = true

# Preserve stored document links and font URLs from Nharazim 1.000.
[[redirects]]
  from = "/Fonts/Infernal-Font-1.000/Web/Nharazim-Regular.woff2"
  to = "/Fonts/Infernal-Font-1.000/fonts/Nharazim-Regular.woff2"
  status = 301

[[redirects]]
  from = "/Fonts/Infernal-Font-1.000/Web/Nharazim-Regular.woff"
  to = "/Fonts/Infernal-Font-1.000/fonts/Nharazim-Regular.woff"
  status = 301

[[redirects]]
  from = "/Fonts/Infernal-Font-1.000/Desktop/Nharazim-Regular.ttf"
  to = "/Fonts/Infernal-Font-1.000/fonts/Nharazim-Regular.ttf"
  status = 301

[[redirects]]
  from = "/Fonts/Infernal-Font-1.000/Web/nharazim.css"
  to = "/Fonts/Infernal-Font-1.000/nharazim.css"
  status = 301

[[redirects]]
  from = "/Fonts/Infernal-Font-1.000/Web/demo.html"
  to = "/Fonts/Infernal-Font-1.000/demo.html"
  status = 301

[[redirects]]
  from = "/Fonts/Infernal-Font-1.000/Vorschau/Nharazim_Zeichentafel.png"
  to = "/Fonts/Infernal-Font-1.000/Zeichentafel.png"
  status = 301

[[redirects]]
  from = "/Fonts/Infernal-Font-1.000/Vorschau/Nharazim_Render_Test.png"
  to = "/Fonts/Infernal-Font-1.000/Leseprobe.png"
  status = 301

[[redirects]]
  from = "/firebase.json"
  to = "/not_found.html"
  status = 404
  force = true

[[redirects]]
  from = "/Stammb%C3%A4ume/tests/*"
  to = "/not_found.html"
  status = 404
  force = true

[[redirects]]
  from = "/AleriaAlmanach/scripts/*"
  to = "/not_found.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
