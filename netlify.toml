[build]
  command = "node Karten/tools/build-media-library.mjs"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # Safelist only the public Firebase browser identifier; all other smart detection remains active.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyCgSej0WkSlkfAlySKZAdCyu4JjTNZEnYg"

[[redirects]]
  from = "/Karten/Cenyr/celtigerns-wacht/CeltigernsWachtKarte.html"
  to = "/Karten/karte.html?map=cenyr-celtigerns-wacht"
  status = 301
  force = true

[[redirects]]
  from = "/karten-v2/assets/*"
  to = "/karten-v2/dist/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/karten-v2/maps/*"
  to = "/karten-v2/dist/maps/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/karten-v2/*"
  to = "/karten-v2/dist/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/firebase/*"
  to = "/not_found.html"
  status = 404
  force = true

# Preserve Karnrith 2.000 links; the previous language source remains archived.
[[redirects]]
  from = "/Fonts/Karnrith-Font-2.000/Web/KarnrithHochschnitt-Regular.woff2"
  to = "/Fonts/Karnrith-Font-2.000/fonts/KarnrithTiefenrunen-Regular.woff2"
