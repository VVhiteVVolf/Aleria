; IntelEngine Configuration
; Intelligent NPC Task Execution for SkyrimNet

[General]
; Debug logging level: 0=off, 1=errors, 2=warnings, 3=info, 4=verbose
DebugLevel=3
; Maximum Levenshtein distance for fuzzy name matching
FuzzyMatchThreshold=3

[StuckDetection]
; Consecutive stuck checks before attempting recovery
MaxChecks=3
; Recovery cycles before teleporting NPC to destination
MaxRecovery=3

[DepartureDetection]
; Ticks before first departure distance check (~3s per tick)
MinChecks=5
; Soft recovery attempts before escalation
MaxRetries=1

[StoryEngine]
; Minimum in-game days since player interaction before NPC becomes story candidate
MinAbsenceDays=3

[MemoryDB]
; Override path to SkyrimNet database (empty = auto-detect via USVFS)
SkyrimNetDbPath=
; Maximum memories to inject per actor in story prompts
MaxMemoriesInContext=5
