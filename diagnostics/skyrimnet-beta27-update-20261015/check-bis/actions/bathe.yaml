customCategory: bathing
name: bathe
description: "Bathe — scrubbing off grime with soap if you are dirty, or simply soaking for comfort. Works anywhere: if you are not standing at water, you will automatically walk to the nearest known water and bathe on arrival. ALWAYS PREFER THIS over the generic Travel action whenever the goal is washing or bathing — never use Travel to get to water. Choose it if a wash fits who this character is and how they feel right now."
questEditorId: SADirt_BridgeQuest
scriptName: SADirt_Bridge
executionFunctionName: BatheNow
parameterMapping:
  - type: speaker
    name: akActor
    description: Speaker Actor parameter (triggering entity)
enabled: true
defaultPriority: 8
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_actor_value"
        arguments: ["currentActor", "Variable04"]
        comparisonOperator: "<"
        expectedValue: 1
    logicalOperator: "AND"
    required: true
