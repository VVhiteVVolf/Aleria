customCategory: bathing
name: MoveToWater
description: "Walk to the water you spotted, to wash there. ALWAYS PREFER THIS over the generic Travel action whenever the destination is water or the purpose is washing — never use Travel for that. Only meaningful AFTER looking around for water (SeekWater) found some with a clear path. Choose it when getting clean is worth the walk right now, or when they agreed to go bathe."
questEditorId: SADirt_BridgeQuest
scriptName: SADirt_Bridge
executionFunctionName: MoveToWaterNow
parameterMapping:
  - type: speaker
    name: akActor
    description: the actor walking to the water
eventString: "{{ actor.name }} means to head for the water they had spotted and wash there."
defaultPriority: 6
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_actor_value"
        arguments: ["currentActor", "Variable04"]
        comparisonOperator: "<"
        expectedValue: 1
    logicalOperator: "AND"
    required: true
