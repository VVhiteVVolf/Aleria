name: local_meaningful_quest_journal
description: Silently retain displayed journal objectives and completion/failure of
  previously displayed objectives; exclude dormant cleanup and unresolved aliases.
eventCriteria:
- eventType: quest_objective_state
  logicalOperator: AND
  schemaConditions:
  - &id001
    fieldPath: quest
    operator: regex
    value: \S
    caseSensitive: true
  - &id002
    fieldPath: objective
    operator: regex
    value: \S
    caseSensitive: true
  - &id003
    fieldPath: objective
    operator: not_contains
    value: <Alias
    caseSensitive: true
  - fieldPath: new_state
    operator: equals
    value: Displayed
    caseSensitive: true
  - fieldPath: old_state
    operator: not_equals
    value: Displayed
    caseSensitive: true
- eventType: quest_objective_state
  logicalOperator: AND
  schemaConditions:
  - *id001
  - *id002
  - *id003
  - fieldPath: old_state
    operator: equals
    value: Displayed
    caseSensitive: true
  - fieldPath: new_state
    operator: regex
    value: ^(Completed|CompletedDisplayed|Failed|FailedDisplayed)$
    caseSensitive: true
response:
  type: persistent_generic
  content: 'Quest journal update for {{ player_name }}: "{{ event_json.quest }}" —
    objective "{{ event_json.objective }}" changed from {{ event_json.old_state }}
    to {{ event_json.new_state }}. This is the player''s journal state; it does not
    mean every NPC witnessed or knows it.'
audience: player
enabled: true
interrupt: false
probability: 1.0
cooldownSeconds: 0
priority: 1
