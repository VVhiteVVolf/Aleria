<!doctype html><html lang="de"><meta charset="utf-8"><title>Lokale Itemprüfung</title><style>body{background:#18201e;color:#eee;font:18px system-ui;padding:2rem}button{padding:.7rem;margin:.5rem}pre{white-space:pre-wrap}</style><h1>Lokale Itemprüfung · ohne Firebase</h1><p>Alle Speicheraktionen dieser Seite verwenden ausschließlich einen Arbeitsspeicheradapter.</p><button id="existing">Langschwert auswählen</button><button id="variant">Serienvariante erstellen</button><button id="unique">Unikat erstellen</button><button id="review">Bestand prüfen</button><pre id="result" role="status"></pre><script type="module">
import { openItemBuilder } from '/AleriaAlmanach/modules/item-builder/item-builder-controller.js';
import { itemDefinitionStore } from '/AleriaAlmanach/modules/item-definitions/item-definition-store.js';
import { normalizeItemDefinition, definitionTemplate } from '/AleriaAlmanach/modules/item-definitions/item-definition-model.js';
import { STANDARD_ITEMS } from '/AleriaAlmanach/modules/item-register/item-register-standard.js';
import { openItemMigrationDialog } from '/AleriaAlmanach/modules/item-definitions/item-migration-dialog.js';
const api = { subscribe(next) { next([], { fromCache: false }); return () => {}; }, async commit(input) { const definition = normalizeItemDefinition(input.definition, { revision: 'local-test-version' }); return { definition, template: definitionTemplate(definition) }; } };
globalThis._fb = { itemDefinitions: api }; itemDefinitionStore.connect(api);
const source = STANDARD_ITEMS.find(item => item.id === 'standard:waffen-rustungen:langschwert');
for (const intent of ['existing','variant','unique']) document.getElementById(intent).addEventListener('click', async () => { try { const item = await openItemBuilder({ source, intent, key: `test:${intent}` }); document.getElementById('result').textContent = item ? JSON.stringify(item, null, 2) : 'Abgebrochen'; } catch(error) { document.getElementById('result').textContent = error.stack; } });
document.getElementById('review').addEventListener('click', () => openItemMigrationDialog([{ id: 'test', name: 'Prüffigur', inventory: { items: [{ id: 'a', name: 'Schwert', templateId: source.id }] } }]));
</script></html>
