<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Familien und Häuser Alerias nach Gebieten und Rang entdecken">
  <meta name="aleria-firebase-enabled" content="true">
  <title>Aleria · Familienregister</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/registry.css">
</head>
<body class="registry-body">
  <main class="registry-shell">
    <header class="registry-header">
      <div>
        <p class="eyebrow">Aleria Almanach · Genealogische Archive</p>
        <h1>Familienregister</h1>
        <p>Dynastien, Häuser und Nebenlinien nach Regionen und Herrschaftsgebieten geordnet.</p>
      </div>
      <div class="registry-header-actions">
        <a class="button button--quiet" href="index.html">Zur Startseite</a>
        <a class="button" href="Stammbaum.html?mode=view">Stammbaum öffnen</a>
      </div>
    </header>

    <section class="registry-toolbar" aria-label="Register durchsuchen">
      <label class="registry-search">
        <span aria-hidden="true">⌕</span>
        <span class="sr-only">Familien suchen</span>
        <input type="search" id="registry-search" placeholder="Haus, Gebiet oder Rang suchen …" autocomplete="off" aria-controls="registry-content">
      </label>
      <p><strong id="registry-count">0</strong> Familienakten</p>
    </section>

    <div class="registry-browser">
      <details class="registry-sidebar" open>
        <summary>Gebietsauswahl <span>Länder & Orte</span></summary>
        <p class="registry-navigation-hint">Die Anzahl umfasst auch die Unterorte.</p>
        <nav data-role="registry-navigation" aria-label="Gebiete auswählen"></nav>
      </details>
      <section class="registry-content" id="registry-content" data-role="registry-content" aria-labelledby="registry-location-title"></section>
    </div>
    <p class="sr-only" data-role="registry-status" role="status" aria-live="polite"></p>
  </main>

  <script type="module" src="assets/js/registry-app.js"></script>
</body>
</html>
